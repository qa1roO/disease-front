<!--
  PROTOTYPE — throwaway, do not build on this file.
  Follow-up to shared-front-v4. Question: does the owner's sketch work, i.e. one horizontal front where every
  chapter is one region crossing it, chapters fill the width edge to edge, and small chapters nest inside big ones?
    A  Nested arches     — every chapter owns a stretch of the line: an arch above (contested, fog on top) and
                           one below (held). Small chapters nest at the edge of a bigger neighbour, under its arches.
                           A taller arch reaches over its neighbour, separately above and below the line.
                           Tune with ?pan= (map width in screens), ?width= (1 = width ∝ burden, 0.5 = ∝ √burden),
                           ?flat= (arch flatness, 2 = round), ?over= (overhang, share of the neighbour's width)
                           and ?wobble= (shape irregularity, 0 = smooth).
    B  Archipelago       — from v4: islands along a meandering diagonal front (tune with ?aspect=, ?round=, ?gap=).
    C  Chapter identity  — from v3: the v1 two-countries map with per-chapter colours and hover.
  Switch with ?variant=A|B|C, the bottom bar, or ← / →. Scroll to zoom, drag to pan.
  Detail levels: zoom < 2.2 chapters only, 2.2–6 blocks, ≥ 6 provinces.
-->

<script>
// ---------- fake data (same generator and seed as the other prototypes) ----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(42);
const normal = () => { let u = 0; while (!u) u = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rng()); };
const hash = s => [...s].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619), 2166136261);

// [ICD-11 chapter, burden scale, chance a diagnosed status is held]
const CHAPTERS = [
  ['Certain infectious or parasitic diseases', 9, .7], ['Neoplasms', 10, .35],
  ['Diseases of the blood or blood-forming organs', 2, .5], ['Diseases of the immune system', 1.5, .4],
  ['Endocrine, nutritional or metabolic diseases', 5, .6], ['Mental, behavioural or neurodevelopmental disorders', 6, .35],
  ['Sleep-wake disorders', 1, .5], ['Diseases of the nervous system', 5, .2],
  ['Diseases of the visual system', 2, .6], ['Diseases of the ear or mastoid process', 1, .55],
  ['Diseases of the circulatory system', 12, .55], ['Diseases of the respiratory system', 6, .5],
  ['Diseases of the digestive system', 4, .6], ['Diseases of the skin', 2, .55],
  ['Diseases of the musculoskeletal system or connective tissue', 4, .3], ['Diseases of the genitourinary system', 3, .55],
  ['Conditions related to sexual health', .5, .6], ['Pregnancy, childbirth or the puerperium', 3, .75],
  ['Certain conditions originating in the perinatal period', 4, .5], ['Developmental anomalies', 2, .25],
];
const STATUS = { 1: 'Eradicated', 2: 'Curable', 3: 'Controlled', 4: 'Treatable', 5: 'Untreatable', 0: 'Fog (unassessed)' };
const STATUS_COLOR = { 1: '#0f6b4b', 2: '#2e9e6a', 3: '#8fd1a8', 4: '#f2a65a', 5: '#d64545', 0: '#5d6673' };
const AGG_COLOR = { held: '#3b9d6e', contested: '#d9644a', fog: '#5d6673' };
const zoneOf = s => s === 0 ? 'fog' : s <= 3 ? 'held' : 'contested';

function pickStatus(heldP) {
  if (rng() < .15) return 0;
  if (rng() < heldP) { const r = rng(); return r < .05 ? 1 : r < .55 ? 2 : 3; }
  return rng() < .65 ? 4 : 5;
}
const root = { name: 'All diseases', children: CHAPTERS.map(([name, scale, heldP], c) => ({
  name, num: String(c + 1).padStart(2, '0'), children: d3.range(4 + Math.floor(rng() * 11)).map(b => ({
    name: `Block ${c + 1}.${b + 1}`, children: d3.range(5 + Math.floor(rng() * 36)).map(l => ({
      name: `Condition ${c + 1}.${b + 1}.${l + 1}`,
      burden: Math.max(.02, Math.exp(normal() * 1.6) * scale),
      status: pickStatus(heldP),
    })),
  })),
})) };
(function aggregate(n, parent) {
  n.parent = parent;
  if (!n.children) { n.agg = { total: n.burden, held: 0, contested: 0, fog: 0 }; n.agg[zoneOf(n.status)] = n.burden; return n.agg; }
  n.agg = { total: 0, held: 0, contested: 0, fog: 0 };
  for (const c of n.children) { const a = aggregate(c, n); for (const k in a) n.agg[k] += a[k]; }
  return n.agg;
})(root, null);
const LEAF_COUNT = root.children.flatMap(c => c.children.flatMap(b => b.children)).length;
const leavesIn = (block, zone) => block.children.filter(l => zoneOf(l.status) === zone);
const byStatus = (a, b) => (a.status || 9) - (b.status || 9) || b.burden - a.burden;
const chapterOf = n => { while (n.parent && n.parent.parent) n = n.parent; return n; };
const CHAPTER_HUE = new Map(root.children.map((c, i) => [c, d3.interpolateSinebow(i / root.children.length)]));

// ---------- shared helpers ----------
const W = innerWidth, H = innerHeight, LEFT = W > 900 ? 330 : 14, BOTTOM = 70;
const line = d3.line(), closed = p => line(p) + 'Z';
const area = p => p.length < 3 ? 0 : Math.abs(d3.polygonArea(p));
const fmt = d3.format(',.1f'), pct = d3.format('.0%');
const ZOOM = { block: 2.2, leaf: 6 }; // detail level thresholds

// Weighted Voronoi inside a convex polygon. initPos(item, index, prng) gives each seed's start.
// The library throws on, or loops forever over, degenerate pieces; those fall back to plain slices.
const fallbacks = { count: 0 };
function voronoiIn(poly, items, weight, initPos, seed) {
  if (!items.length || poly.length < 3) return [];
  if (items.length === 1) return [{ item: items[0], polygon: poly }];
  const xs = poly.map(p => p[0]), ys = poly.map(p => p[1]);
  const bw = d3.max(xs) - d3.min(xs), bh = d3.max(ys) - d3.min(ys);
  if (area(poly) < 4 || Math.min(bw, bh) < 3 || Math.max(bw, bh) / Math.min(bw, bh) > 12) { fallbacks.count++; return sliceCells(poly, items, weight); }
  for (const init of [initPos, null]) {
    try {
      const r = mulberry32(seed);
      let sim = d3.voronoiMapSimulation(items).weight(weight).clip(d3.polygonHull(poly)).prng(r).maxIterationCount(60).convergenceRatio(.02);
      if (init) sim = sim.initialPosition((d, i) => init(d, i, r));
      sim.stop();
      let st = sim.state();
      for (let i = 0; !st.ended && i < 150; i++) { sim.tick(); st = sim.state(); }
      if (st.polygons.length < items.length) continue; // a site was squeezed out: retry, then slice
      return st.polygons.map(p => ({ item: p.site.originalObject.data.originalData, polygon: Array.from(p) }));
    } catch (e) { /* retry, then slice */ }
  }
  fallbacks.count++;
  return sliceCells(poly, items, weight);
}
// Cut a convex polygon into consecutive slices along its longer axis, one per item, by weight.
function sliceCells(poly, items, weight) {
  const xs = poly.map(p => p[0]), ys = poly.map(p => p[1]);
  const dir = d3.max(xs) - d3.min(xs) >= d3.max(ys) - d3.min(ys) ? [1, 0] : [0, 1];
  const pr = p => p[0] * dir[0] + p[1] * dir[1];
  const total = area(poly), sum = d3.sum(items, weight), ps = poly.map(pr), lo0 = d3.min(ps), hi0 = d3.max(ps);
  const cutAt = frac => { let lo = lo0, hi = hi0; for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (area(clipBy(poly, pr, m, true)) < frac * total) lo = m; else hi = m; } return (lo + hi) / 2; };
  let cum = 0, prev = null;
  return items.map((d, i) => {
    cum += weight(d);
    const next = i < items.length - 1 ? cutAt(cum / sum) : null;
    let p = poly;
    if (prev !== null) p = clipBy(p, pr, prev, false);
    if (next !== null) p = clipBy(p, pr, next, true);
    prev = next;
    return { item: d, polygon: p };
  });
}
// Keep the part of a convex polygon where pr(p) <= t (below) or >= t.
function clipBy(poly, pr, t, below) {
  const out = [], inside = p => below ? pr(p) <= t : pr(p) >= t;
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length], ia = inside(a), ib = inside(b);
    if (ia) out.push(a);
    if (ia !== ib) { const s = (t - pr(a)) / (pr(b) - pr(a)); out.push([a[0] + s * (b[0] - a[0]), a[1] + s * (b[1] - a[1])]); }
  }
  return out;
}

// A world: layers for each detail level (fills, front, fog edge), plus outlines and labels.
// fills [{d, fill, node, chapter, stroke}], chapters [{d, color}], labels [{x, y, text, level, w, h}]
const layer = () => ({ fills: [], front: [], fogEdge: [] });
const emptyWorld = () => ({ layers: { chapter: layer(), block: layer(), leaf: layer() }, chapters: [], blocks: [], labels: [] });

const PARAMS = new URLSearchParams(location.search);
// ---------- A: nested arches (from the owner's sketch) ----------
// One horizontal front line. Every chapter owns a stretch of it and rises above it as an arch (contested,
// with fog at the top) and hangs below it as an arch (held). Chapters fill the width edge to edge.
// Where one chapter's arch is taller than its neighbour's, it reaches over that neighbour (overhang), decided
// separately above and below the line. A small chapter nests at the edge of a bigger neighbour, under its arches.
// Each region (the space between two curves) is laid out in a rectangle that maps onto it with areas preserved,
// so the Voronoi library always gets a convex shape.
// PAN: map width in screens. WIDTH_EXP: 1 = width ∝ burden, 0.5 = ∝ √burden. ARCH_EXP: flatness (2 = round).
// OVER: how far a taller arch reaches over its neighbour, as a share of that neighbour's width. WOBBLE: shape irregularity.
const ARCH_EXP = +(PARAMS.get('flat') || 3), WIDTH_EXP = +(PARAMS.get('width') || .85), PAN = +(PARAMS.get('pan') || 2.5);
const OVER = +(PARAMS.get('over') || .4), WOBBLE = +(PARAMS.get('wobble') || 1);
function arches() {
  const w = emptyWorld();
  const x0 = LEFT + 20, x1 = x0 + (W - 20 - x0) * PAN, y0 = 15, y1 = H - BOTTOM - 10;
  const chs = root.children, idx = new Map(chs.map((c, i) => [c, i]));
  const need = { up: c => c.agg.contested + c.agg.fog, dn: c => c.agg.held };
  const SIDES = ['up', 'dn'];

  // Irregular arch profile on t ∈ [0, 1]: a superellipse, tilted to one side and wobbling.
  const profile = seed => {
    const r = mulberry32(seed), k1 = .5 + r() * .7, k2 = 1.2 + r() * .8, p1 = r() * 6.28, p2 = r() * 6.28;  // low frequencies: lumps, not peaks
    const tilt = (r() - .5) * 1.2 * WOBBLE, e = ARCH_EXP * (.7 + .6 * r());
    return t => {
      if (t <= 0 || t >= 1) return 0;
      const base = Math.pow(1 - Math.pow(Math.abs(2 * t - 1), e), 1 / e);
      const wob = 1 + WOBBLE * (.15 * Math.sin(2 * Math.PI * k1 * t + p1) + .07 * Math.sin(2 * Math.PI * k2 * t + p2));
      return Math.max(0, base * wob * (1 + tilt * (t - .5)));
    };
  };
  // An arch: span [A, B], height h, profile shp. f(x) is its top edge.
  const archF = s => x => (x <= s.A || x >= s.B) ? 0 : s.h * s.shp((x - s.A) / (s.B - s.A));
  const meanOf = shp => d3.mean(d3.range(400), i => shp((i + .5) / 400));

  // Nesting: a chapter under 30% of its bigger neighbour's burden nests inside it, one per side at most.
  const parentOf = new Map(), kids = new Map(chs.map(c => [c, []]));
  chs.forEach((ch, i) => {
    if (kids.get(ch).length) return;
    const nb = [chs[i - 1], chs[i + 1]].filter(n => n && !parentOf.has(n) && !kids.get(n).some(k => (idx.get(k) < idx.get(n)) === (i < idx.get(n))));
    const big = d3.greatest(nb, n => n.agg.total);
    if (big && ch.agg.total < .3 * big.agg.total) { parentOf.set(ch, big); kids.get(big).push(ch); }
  });
  const top = chs.filter(c => !parentOf.has(c));
  const withKids = (c, f) => f(c) + d3.sum(kids.get(c), f);

  // Line stretches: widths ∝ burden^WIDTH_EXP, filling the (panned) width. Areas are in burden units for now.
  const geo = new Map(), sq = top.map(c => Math.pow(withKids(c, d => d.agg.total), WIDTH_EXP));
  let xa = x0;
  top.forEach((c, i) => { const wd = (x1 - x0) * sq[i] / d3.sum(sq); geo.set(c, { a: xa, b: xa + wd }); xa += wd; });
  const U = d3.sum(chs, c => c.agg.total) / ((x1 - x0) * (y1 - y0) * .5); // rough burden-per-px² so heights start near screen scale
  for (const c of chs) {
    const g = geo.get(c) || {};
    g.arch = {};
    SIDES.forEach((side, si) => { g.arch[side] = { shp: profile(hash(c.name + side)) }; });
    geo.set(c, g);
  }

  // Kids: just inside the parent's edge on their own side, widened until their arches sit under the parent's.
  for (const p of top) {
    const pg = geo.get(p), pw = pg.b - pg.a;
    for (const kd of kids.get(p)) {
      const kg = geo.get(kd), left = idx.get(kd) < idx.get(p);
      let frac = Math.min(.4, Math.sqrt(kd.agg.total / withKids(p, d => d.agg.total)));
      for (let tries = 0; tries < 12; tries++, frac = Math.min(.6, frac * 1.15)) {
        const wk = frac * pw, inset = .05 * pw;
        kg.a = left ? pg.a + inset : pg.b - inset - wk; kg.b = kg.a + wk;
        let fits = true;
        for (const side of SIDES) {
          const ka = kg.arch[side], pa = pg.arch[side];
          ka.A = kg.a; ka.B = kg.b; ka.h = need[side](kd) / U / (wk * meanOf(ka.shp));
          const ph = withKids(p, need[side]) / U / (pw * meanOf(pa.shp)), pf = archF({ A: pg.a, B: pg.b, h: ph, shp: pa.shp }), kf = archF(ka);
          if (!d3.range(1, 20).every(j => { const x = kg.a + wk * j / 20; return kf(x) <= .75 * pf(x); })) fits = false;
        }
        if (fits) break;
      }
    }
  }

  // Overhang: for each pair of neighbours and each side, the taller arch (by a first estimate) reaches over the shorter.
  for (const side of SIDES) {
    const h0 = new Map(top.map(c => { const g = geo.get(c); return [c, withKids(c, need[side]) / U / ((g.b - g.a) * meanOf(g.arch[side].shp))]; }));
    for (const c of top) { const g = geo.get(c); g.arch[side].A = g.a; g.arch[side].B = g.b; }
    for (let i = 0; i < top.length - 1; i++) {
      const L = top[i], R = top[i + 1], gl = geo.get(L), gr = geo.get(R);
      if (h0.get(L) >= h0.get(R)) gl.arch[side].B = gl.b + OVER * (gr.b - gr.a);
      else gr.arch[side].A = gr.a - OVER * (gl.b - gl.a);
    }
    // Inner edge g(x) of a top-level chapter's region: its kids' arches on its own stretch, the neighbour's arch where it overhangs.
    for (const c of top) {
      const g = geo.get(c), i = top.indexOf(c), lN = top[i - 1], rN = top[i + 1];
      g.arch[side].inner = x => {
        if (x >= g.a && x <= g.b) return d3.sum(kids.get(c), kd => archF(geo.get(kd).arch[side])(x));
        const n = x < g.a ? lN : rN;
        return n ? archF(geo.get(n).arch[side])(x) : 0;
      };
    }
    // Solve heights shortest-first, so every overhang rests on a neighbour that is already final.
    for (const c of top.slice().sort((p, q) => h0.get(p) - h0.get(q))) {
      const s = geo.get(c).arch[side], target = need[side](c) / U, f = archF(s);
      const areaAt = h => { s.h = h; const N = 240, dx = (s.B - s.A) / N; return d3.sum(d3.range(N), j => { const x = s.A + (j + .5) * dx; return Math.max(0, f(x) - s.inner(x)) * dx; }); };
      let lo = 0, hi = h0.get(c) * 4 + 1;
      while (areaAt(hi) < target) hi *= 2;
      for (let j = 0; j < 40; j++) { const m = (lo + hi) / 2; if (areaAt(m) < target) lo = m; else hi = m; }
      s.h = (lo + hi) / 2;
    }
  }
  // Scale all heights so the tallest edges above and below fit the screen. Everything is linear in this scale.
  const peak = side => d3.max(chs, c => { const s = geo.get(c).arch[side], f = archF(s), g = s.inner || (() => 0);
    return d3.max(d3.range(61), j => { const x = s.A + (s.B - s.A) * j / 60; return Math.max(f(x), g(x)); }); });
  const k = (y1 - y0) / (peak('up') + peak('dn')), yL = y0 + k * peak('up');
  for (const c of chs) for (const side of SIDES) geo.get(c).arch[side].h *= k;
  for (const c of chs) for (const side of SIDES) if (!geo.get(c).arch[side].inner) geo.get(c).arch[side].inner = () => 0;

  // The region between inner edge g and outer edge max(f, g) over [a, b], on one side of the line (-1 up, +1 down).
  // Rectangle [a, b] × [0, hbar] maps onto it with areas preserved: X follows cumulative area, Y the share of local depth.
  function region(a, b, f, g, side) {
    const N = 400, xs = d3.range(N + 1).map(i => a + (b - a) * i / N), dep = xs.map(x => Math.max(0, f(x) - g(x)));
    const cum = [0];
    for (let i = 1; i <= N; i++) cum.push(cum[i - 1] + (dep[i] + dep[i - 1]) / 2 * (b - a) / N);
    const total = cum[N];
    if (total < 1) return null;
    const hbar = total / (b - a);
    const xOf = X => {
      const target = (X - a) * hbar, i = Math.max(0, Math.min(N - 1, d3.bisectRight(cum, target) - 1));
      const span = cum[i + 1] - cum[i], t = span > 0 ? (target - cum[i]) / span : 0;
      return xs[i] + Math.max(0, Math.min(1, t)) * (xs[i + 1] - xs[i]);
    };
    const toXY = ([X, Y]) => { const x = xOf(X), gi = g(x), fi = Math.max(gi, f(x)); return [x, yL + side * (gi + Y / hbar * (fi - gi))]; };
    // Outline: outer edge left → right, inner edge back.
    const ox = d3.range(0, 121).map(j => a + (b - a) * j / 120);
    const outline = closed([...ox.map(x => [x, yL + side * Math.max(g(x), f(x))]), ...ox.slice().reverse().map(x => [x, yL + side * g(x)])]);
    return { a, b, hbar, toXY, outline };
  }
  // Long edges need many points to follow the arches, so subdivide by length (about every 3 px).
  const curve = (poly, toXY) => {
    const pts = [];
    poly.forEach((p, i) => {
      const q = poly[(i + 1) % poly.length], n = Math.max(2, Math.ceil(Math.hypot(q[0] - p[0], q[1] - p[1]) / 3));
      for (let j = 0; j < n; j++) pts.push(toXY([p[0] + (q[0] - p[0]) * j / n, p[1] + (q[1] - p[1]) * j / n]));
    });
    return closed(pts);
  };

  const order = top.flatMap(c => [c, ...kids.get(c)]);   // parents before kids, so kid outlines draw on top
  for (const ch of order) {
    const g = geo.get(ch), su = g.arch.up, sd = g.arch.dn;
    const rUp = region(su.A, su.B, archF(su), su.inner, -1), rDn = region(sd.A, sd.B, archF(sd), sd.inner, 1);
    const cs = need.up(ch) > 0 ? ch.agg.contested / need.up(ch) : 0;
    const zones = [];
    if (rDn) zones.push(['held', rDn, 0, rDn.hbar]);
    if (rUp && cs > 0) zones.push(['contested', rUp, 0, rUp.hbar * cs]);
    if (rUp && cs < 1) zones.push(['fog', rUp, rUp.hbar * cs, rUp.hbar]);
    for (const [zone, R, ya, yb] of zones) {
      const zp = [[R.a, ya], [R.b, ya], [R.b, yb], [R.a, yb]];

if (!VARIANTS[variant]) variant = 'A';
const stats = {}, cache = {};

function updateZoom() { const el = document.getElementById('zoom'); if (el) el.textContent = `zoom ×${(stats.k || 1).toFixed(1)} · showing ${stats.level}s`; }
function renderPanel() {
  const v = VARIANTS[variant];
  document.getElementById('panel').innerHTML =
    `<h1>${variant} · ${v.name}</h1><div class="muted">${v.desc}</div>
     <div class="muted"><span id="zoom"></span></div>
     <div class="muted">${stats.cells} / ${LEAF_COUNT} provinces laid out · layout ${Math.round(stats.ms)} ms · ${stats.fallbacks} pieces sliced instead of Voronoi</div>
     <div class="muted">Scroll to zoom: chapters → blocks (×${ZOOM.block}) → provinces (×${ZOOM.leaf}).</div><hr>
     <div id="hover"></div><hr>
     ${[1, 2, 3, 4, 5, 0].map(s => `<div class="row"><span class="sw" style="background:${STATUS_COLOR[s]}"></span>${STATUS[s]}</div>`).join('')}
     <div class="row"><span class="sw" style="background:${AGG_COLOR.held}"></span><span class="sw" style="background:${AGG_COLOR.contested}"></span>Held / contested share (zoomed out)</div>
     <div class="row"><span class="sw" style="background:#ffe08a"></span>Front line (held | contested)</div>
     <div class="row"><span class="sw" style="background:repeating-linear-gradient(90deg,#c9d1d9 0 3px,transparent 3px 6px)"></span>Edge of fog</div>`;
  updateZoom();
  showHover(null);
  document.getElementById('vlabel').textContent = `${variant} (${v.name})`;
}
function render() {
  const loading = document.getElementById('loading');
  loading.style.display = 'grid';
  setTimeout(() => {
    svg.selectAll('*').remove(); svg.on('.zoom', null); stats.k = 1;
    const t0 = performance.now(), f0 = fallbacks.count;
    const w = cache[variant] || (cache[variant] = VARIANTS[variant].build());
    if (!w.ms) { w.ms = performance.now() - t0; w.fallbacks = fallbacks.count - f0; }
    stats.ms = w.ms; stats.fallbacks = w.fallbacks; stats.cells = w.layers.leaf.fills.length;
    renderWorld(w);
    renderPanel();
    loading.style.display = 'none';
  }, 20);
}
function cycle(step) {
  const keys = Object.keys(VARIANTS);
  variant = keys[(keys.indexOf(variant) + step + keys.length) % keys.length];
  const url = new URL(location.href); url.searchParams.set('variant', variant); history.replaceState(null, '', url);
  render();
}
document.getElementById('prev').onclick = () => cycle(-1);
document.getElementById('next').onclick = () => cycle(1);
addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});
render();
</script>
</body>
</html>
