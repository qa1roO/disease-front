# ICD-10 codes for GBD causes in scope that GBD's own cause -> ICD map (data/raw/gbd/icd_codes.csv) gives no
# codes for. GBD estimates these from surveys or splits them out of a parent by modelling, so its map leaves
# them blank. Without codes, every ICD-11 disease under them would be fog.
#
# This list is the project's own work, not IHME's: one plain ICD-10 match per condition, chosen by name.
# Stage 4 uses it only after GBD's own lists, so GBD's assignments always win. Review and edit freely.
#
# Left out on purpose, because no clean ICD-10 match exists: latent TB (954), HIV/AIDS-TB splits (949, 950),
# extensively drug-resistant TB (947), the liver cancer and cirrhosis etiology splits (418-421, 996, 522-525),
# other mental disorders (585), other vision loss (1162), G6PD trait (839), caries of deciduous teeth (681,
# shares K02 with permanent teeth). Stage 4 folds those into their nearest GBD parent that has codes.
- {cause_id: 355, cause: Onchocerciasis, icd10: "B73"}
- {cause_id: 362, cause: Trichuriasis, icd10: "B79"}
- {cause_id: 363, cause: Hookworm disease, icd10: "B76-B76.9"}
- {cause_id: 364, cause: Food-borne trematodiases, icd10: "B66.0-B66.1, B66.3-B66.5"}
